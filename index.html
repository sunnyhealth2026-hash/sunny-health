let sevenStep=0;
function sevenAnswers(){return state.sevenAnswers||{};}
function sevenAnswered(){return CLIENT_SEVEN.reduce((n,g,i)=>n+g.questions.filter((_,j)=>sevenAnswers()[i+'_'+j]!==undefined).length,0)}
function answerSeven(i,j,v){state.sevenAnswers=state.sevenAnswers||{};state.sevenAnswers[i+'_'+j]=v;state.assessment=false;save();render()}
function goSeven(i){sevenStep=Math.max(0,Math.min(6,i));render();window.scrollTo(0,0)}
function submitSeven(role){if(sevenAnswered()<14){alert('请先完成七个步骤的选择题');return}state.assessment=true;state.assessmentCompletedAt=new Date().toISOString();state.symptoms=[];state.riskReviewed=false;state.riskLevel=null;save();render();alert('七级健康评估已提交。健康管理师将核实风险证据并安排个性化体检项目审核。')}

 const g=CLIENT_SEVEN[sevenStep],ans=sevenAnswers(),count=sevenAnswered(),done=state.assessment&&count===14;
 return head('七级全维度健康状态评估问卷','直接按7个简单步骤完成')+`<div class="questionnaire"><div class="q-hero"><div class="q-symbol">☀</div><h2>七级全维度健康状态评估问卷</h2><p>请根据自己的实际情况选择。不了解的内容可以选择“不清楚”，无需猜测。</p></div><div class="q-progress"><div class="q-progress-top"><span>第 ${sevenStep+1} 步 / 共7步 · ${escapeHtml(g.name)}</span><span>已答 ${count} / 14 题</span></div><div class="q-track"><div class="q-fill" style="width:${count/14*100}%"></div></div></div><div class="q-section-tabs">${CLIENT_SEVEN.map((x,i)=>`<button class="q-tab ${i===sevenStep?'on':''} ${x.questions.every((_,j)=>ans[i+'_'+j]!==undefined)?'done':''}" onclick="goSeven(${i})">${i+1}. ${escapeHtml(x.name)}</button>`).join('')}</div><div class="q-dimension">${escapeHtml(g.hint)}</div>${g.questions.map((q,j)=>`<div class="q-card"><div class="q-no">第 ${sevenStep+1} 步 · 问题 ${j+1}</div><div class="q-text">${escapeHtml(q[0])}</div><div class="q-options" style="grid-template-columns:repeat(${q[1].length},minmax(0,1fr))">${q[1].map((v,k)=>`<button class="q-option ${ans[sevenStep+'_'+j]===k?'chosen':''}" aria-pressed="${ans[sevenStep+'_'+j]===k}" onclick="answerSeven(${sevenStep},${j},${k})">${escapeHtml(v)}</button>`).join('')}</div></div>`).join('')}<div class="q-actions"><button class="button secondary" ${sevenStep===0?'disabled':''} onclick="goSeven(${sevenStep-1})">← 上一步</button>${sevenStep<6?`<button class="button" onclick="goSeven(${sevenStep+1})">下一步 →</button>`:`<button class="button" onclick="submitSeven('${role}')" ${count<14?'disabled':''}>提交七级健康评估</button>`}</div>${done?`<div class="q-result"><strong>✓ 已完成七级评估</strong><p>问卷已提交，下一步由健康管理师核对体检指标与病史，再生成待医生审核的个性化体检项目。</p><button class="button secondary" onclick="${role==='client'?"go('clientExam')":"go('risk')"}">${role==='client'?'查看我的体检进度':'查看风险证据与推荐'} →</button></div>`:''}<p class="q-note">这是七级评估框架的客户易懂版初筛题，不是原始正式题库或已验证的13级风险评分。若正在发生胸痛、晕厥、明显呼吸困难等急症，请立即就医或联系急救，不等待问卷结果。数据仅保存在本地演示浏览器中。</p></div>`;
}

function progress(){const s=[['client','客户建档',true],['assessment','健康评估',state.assessment],['risk','风险证据',!!state.riskReviewed],['exam','体检选项',state.exam.length>0],['checkout','费用确认',state.paid],['report','检后报告',state.report],['service','签约授权',state.contract&&state.consent],['wecom','专属群服务',state.group]];return '<div class="steps">'+s.map(x=>`<button class="step ${x[2]?'done':''} ${page===x[0]?'current':''}" onclick="go('${x[0]}')">${x[2]?'✓ ':''}${x[1]}</button>`).join('')+'</div>'}function head(t,desc){return `<div class="sectionhead"><div><h1>${t}</h1><div class="muted">${desc}</div></div><span class="pill demo">本地演示 · 非生产环境</span></div>`}function go(p){if(activeRole&&!roleNav[activeRole].some(n=>n[0]===p)){return}page=p;render();window.scrollTo(0,0)}function set(k,v){state[k]=v;save();render()}function val(id){return $(id)?.value||''}function card(t,b){return `<div class="card"><h3>${t}</h3>${b}</div>`}function field(label,id,value,type='text'){return `<label class="field">${label}<input id="${id}" type="${type}" value="${escapeHtml(value)}"></label>`}function notice(t,ok=false){return `<div class="notice ${ok?'success':''}">${t}</div>`}function check(condition,label){return `<span class="pill ${condition?'':'warn'}">${condition?'✓ 已完成':'待完成'} · ${label}</span>`}

if(page==='client')return head('客户360°档案','客户唯一主档：体检、健康、服务和财务统一关联')+progress()+card('客户基础信息',`<div class="form">${field('客户姓名','name',state.name)}${field('年龄','age',state.age,'number')}<label class="field">性别<select id="sex"><option ${state.sex==='男'?'selected':''}>男</option><option ${state.sex==='女'?'selected':''}>女</option><option ${state.sex==='其他'?'selected':''}>其他</option></select></label>${field('联系电话','phone',state.phone)}<label class="field">客户主来源<select id="source"><option ${state.source==='体检中心业务员'?'selected':''}>体检中心业务员</option><option ${state.source==='渠道机构'?'selected':''}>渠道机构</option></select></label>${field('业务员姓名 / 渠道机构','sourceName',state.sourceName)}${field('当前主要关注','condition',state.condition)}<div class="wide"><button class="button" onclick="saveClient()">保存客户档案</button> <button class="button secondary" onclick="go('assessment')">下一步：健康评估 →</button></div></div>`)+`<div class="footer">演示环境中仅保存在当前浏览器。不要填写真实客户的敏感健康信息。</div>`;

function saveClient(){['name','age','sex','phone','source','sourceName','condition'].forEach(k=>state[k]=val(k));save();go('assessment')}function saveAssessment(){submitQuestionnaire('manager')}function saveExam(){state.exam=items.filter(i=>$('exam_'+i.id).checked).map(i=>i.id);save();render()}function autoExam(){state.exam=buildRecommendations().filter(r=>r.status==='基础候选').map(r=>r.id);save();render()}function confirmPayment(){if(!state.exam.length){alert('请先选择至少一个项目');return}state.paid=true;save();render()}function activateService(){if(!$('contract').checked||!$('consent').checked){alert('请先确认演示服务签约及数据处理授权');return}state.contract=true;state.consent=true;state.group=true;state.edu=$('edu').checked;save();go('wecom')}function quickMsg(t){if($('msg'))$('msg').value=t;sendMsg()}function sendMsg(){if(!state.group){alert('请先完成演示服务开通');return}const t=val('msg').trim();if(!t)return;ingestMessage(t)}function ingestMessage(t){state.messages.push({role:'user',text:t});const meal=/早餐|午餐|晚餐|夜宵|吃了|米饭|鸡肉|青菜|面条|食物|饮食/.test(t),blood=/血糖/.test(t);let replies=[];const stamp=new Date().toLocaleString('zh-CN');if(meal){state.meals.push({text:t,time:stamp});replies.push('已将饮食描述保存为待确认记录。照片、份量、油糖用量尚未核实，不生成精确热量。');state.tasks.push('核对客户最新餐次的份量和营养估算')}if(blood){const m=t.match(/(?:血糖[^\d]{0,12})?(\d{1,2}(?:\.\d+)?)\s*(mmol\/?L|mg\/?dL)?/i);if(m){let value=Number(m[1]);let unit=m[2]||(/mmol/.test(t)?'mmol/L':'');if(unit.toLowerCase().includes('mg'))value=value/18.018;if(unit){state.glucose.push({value:Math.round(value*100)/100,context:/空腹/.test(t)?'空腹':/餐后/.test(t)?'餐后':'测量场景待确认',time:stamp});replies.push('已记录客户自述血糖数据，等待结合测量时点及个人目标核实。');state.tasks.push('核对客户血糖数据及测量场景')}else{replies.push('检测到血糖数值，但缺少单位，暂不写入确定读数。');state.tasks.push('确认客户血糖单位')}}else replies.push('请补充血糖数值、单位和测量时间。')}if(!replies.length)replies.push('收到。此处为演示回复草稿，正式版将调用受控知识库并由管家审核。');state.messages.push({role:'ai',text:replies.join('\n')});save();render()}function closeTask(i){state.tasks.splice(i,1);save();render()}

function dbOpen(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error('浏览器不支持本地文件存储'));return}let q=indexedDB.open('longevity_reports_v09',1);q.onupgradeneeded=()=>{let d=q.result;if(!d.objectStoreNames.contains('reports'))d.createObjectStore('reports',{keyPath:'id'})};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function dbPut(entry){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction('reports','readwrite');tx.objectStore('reports').put(entry);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}
async function dbAll(){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction('reports','readonly');let q=tx.objectStore('reports').getAll();q.onsuccess=()=>{db.close();res(q.result||[])};q.onerror=()=>rej(q.error)})}
async function dbGet(id){let db=await dbOpen();return new Promise((res,rej)=>{let q=db.transaction('reports','readonly').objectStore('reports').get(id);q.onsuccess=()=>{db.close();res(q.result)};q.onerror=()=>rej(q.error)})}
async function dbDelete(id){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction('reports','readwrite');tx.objectStore('reports').delete(id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}

function hubSelector(){return `<label>选择会员 <select class="hub-select" onchange="hubSelect(this.value)">${hub.members.map(x=>`<option value="${escapeHtml(x.id)}" ${hub.selected===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}</select></label>`}
function hubScores(){return ['代谢与免疫','健康状态与心脏安全','健康危险因素','身体恢复与活力','个人与家族病史','生活方式','心血管风险深度筛查'].map(x=>x+'：待专业核定').join('\n')}
function hubOverview(){let pending=hub.members.filter(x=>x.status!=='已完成'),review=hub.members.filter(x=>x.submitted&&!x.reviewed);return `<div class="hub-kpis">${[['会员总数',hub.members.length],['本地新增会员',hub.members.length],['待跟进客户',pending.length],['待审核报告',review.length]].map(a=>card(a[0],`<div class="stat">${a[1]}</div>`)).join('')}</div><div class="grid g2" style="margin-top:16px">${card('待跟进客户',pending.map(x=>`<div class="hub-file">${escapeHtml(x.name)} · ${escapeHtml(x.status)} <button class="button secondary" onclick="hubSelect('${x.id}');hubTab=1;render()">查看会员</button></div>`).join('')||'暂无')}${card('待审核报告',review.map(x=>`<div class="hub-file">${escapeHtml(x.name)} <button class="button secondary" onclick="hubSelect('${x.id}');hubTab=3;render()">查看报告</button></div>`).join('')||'暂无')}</div>${card('客户分型统计',`<p class="hub-small">正式代谢分型需专业规则与检查数据，不根据演示问卷自动诊断。</p>${[...new Set(hub.members.map(x=>x.type||'待核定'))].map(t=>{let n=hub.members.filter(x=>(x.type||'待核定')===t).length;return `<p>${escapeHtml(t)}：${n}人</p><div class="hub-plot"><div style="width:${n/hub.members.length*100}%"></div></div>`}).join('')}`)}`}
function hubMembers(){return card('会员管理',`<input class="hub-input" placeholder="搜索会员姓名" value="${escapeHtml(hubSearch)}" oninput="hubSearch=this.value;render()"><table class="hub-table"><tr><th>会员</th><th>状态</th><th>风险</th><th>操作</th></tr>${hub.members.filter(x=>x.name.includes(hubSearch)).map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${escapeHtml(x.status)}</td><td>${escapeHtml(x.risk)}</td><td><button class="button secondary" onclick="hubSelect('${x.id}');hubTab=3;render()">进入详情</button></td></tr>`).join('')}</table><div class="hub-actions"><button class="button secondary" onclick="hubAdd()">新增演示会员</button><button class="button secondary" onclick="go('client')">进入原V0.9客户360°</button></div>`)+card('当前会员档案内部记录',hubSelector()+`<label>跟进状态<select class="hub-select" onchange="hubEdit('status',this.value);render()">${['待跟进','跟进中','已完成'].map(v=>`<option ${hubMember().status===v?'selected':''}>${v}</option>`).join('')}</select></label><label>内部备注<textarea class="hub-textarea" oninput="hubEdit('notes',this.value)">${escapeHtml(hubMember().notes)}</textarea></label>`)}
function hubAdd(){let name=prompt('演示会员名称（请勿输入真实身份信息）');if(!name)return;let id='m'+Date.now();hub.members.push({id,name,created:new Date().toISOString(),status:'待跟进',type:'待核定',risk:'待核定',notes:'',abnormal:'',reviewed:false,full:'',internal:'',published:false});hub.selected=id;hubSave();render()}
function hubQuestionnaires(){return card('问卷提交记录',`<p class="hub-small">原V0.9七级评估入口与问卷数据保持不变；四维得分仅在接入正式34题问卷后才会显示。</p><label>分型筛选<select class="hub-select" onchange="hubFilter=this.value;render()">${['全部','待核定'].map(v=>`<option ${hubFilter===v?'selected':''}>${v}</option>`).join('')}</select></label><table class="hub-table"><tr><th>会员</th><th>问卷</th><th>四维得分</th><th>代谢分型</th></tr>${hub.members.filter(x=>hubFilter==='全部'||x.type===hubFilter).map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${x.submitted?'已提交':'未提交'}</td><td>待正式评分</td><td>${escapeHtml(x.type)}</td></tr>`).join('')}</table><button class="button secondary" onclick="go('assessment')">打开原V0.9检前评估</button>`)}
function hubReports(){let x=hubMember();return card('客户报告与检测文件',hubSelector()+`<div class="manager-hub-nav"><button class="${hubReportTab===0?'current':''}" onclick="hubReportTab=0;render()">初筛评估报告</button><button class="${hubReportTab===1?'current':''}" onclick="hubReportTab=1;render()">完整版健康管理报告</button></div><div class="hub-pre">${escapeHtml(hubReportTab===0?`客户：${x.name}\n问卷状态：${x.submitted?'已提交':'未提交'}\n四维代谢评分：待正式评分\n七级评估：待专业核定\n风险等级：${x.risk}`:x.full||'暂无完整版报告。可在个性化健康管理方案中生成草稿。')}</div><p class="hub-small">外院报告原件保留在V0.9上传中心，管理师可通过原导航「外院报告审核」查看。</p><button class="button secondary" onclick="go('externalReports')">查看外院报告审核</button><label>异常指标摘要<textarea class="hub-textarea" oninput="hubEdit('abnormal',this.value)" placeholder="指标、单位、参考区间、检查日期、报告来源">${escapeHtml(x.abnormal)}</textarea></label><label><input type="checkbox" ${x.reviewed?'checked':''} onchange="hubEdit('reviewed',this.checked)"> 已完成人工审核（演示）</label>`)}
function hubFullText(x){return `《全生命周期健康管理报告》\n会员：${x.name}\n生成时间：${new Date().toLocaleString('zh-CN')}\n\n一、客户基础信息与健康目标\n会员备注：${x.notes||'待补充'}\n\n二、评估数据与证据来源\n问卷：${x.submitted?'已提交':'待提交'}；异常指标：${x.abnormal||'待补充'}\n\n三、七级全维度健康评估\n${hubScores()}\n\n四、风险优先级与核心问题\n待专业核定，不自动作疾病诊断。\n\n五、个性化生活方式管理\n建议专业人员结合客户作息、运动、饮食记录制定方案。\n\n六、营养及营养素建议\n具体营养素品种、剂量和禁忌需专业审核，不自动开处方。\n\n七、随访与复评安排\n待健康管理师结合检查时间及客户目标制定。\n\n八、执行与审核说明\n本报告为本地模板演示草稿，正式发布需人工审核。\n\n本方案为私人健康营养干预与生活管理建议，仅作健康调理参考，不构成疾病诊断或处方。`}
function hubGenerate(){let x=hubMember();x.full=hubFullText(x);x.reviewed=false;x.published=false;hubSave();render()}
function hubInternal(){let x=hubMember();x.internal=`健康管理师内部摘要｜${x.name}\n风险等级：${x.risk}\n七大维度：\n${hubScores()}\n核心问题TOP3：待补充临床证据后核定\n沟通重点：${x.notes||'核实症状、既往调理史、健康目标'}\n异常指标：${x.abnormal||'待补充'}\n后续检测：由专业人员结合已有报告确定，不自动开具。`;hubSave();render()}
function hubPublish(){let x=hubMember();if(!x.full)return alert('请先生成报告草稿');if(!x.reviewed)return alert('请先在报告管理勾选人工审核');x.published=true;hubSave();render();alert('已发布至本地演示客户报告中心（同浏览器）。')}
function hubPlans(){let x=hubMember();return card('个性化健康管理方案 · 手动节点',`<p class="hub-small">此处为本地模板模拟，不是实际AI模型。八大模块标题为占位结构，正式内容须按你的最终报告模板核对。</p>`+hubSelector()+`<div class="manager-hub-nav"><button class="${hubPlanTab===0?'current':''}" onclick="hubPlanTab=0;render()">重生成完整版报告</button><button class="${hubPlanTab===1?'current':''}" onclick="hubPlanTab=1;render()">客户内部评估摘要</button></div>${hubPlanTab===0?`<label>特殊情况 / 既往调理史备注<textarea class="hub-textarea" oninput="hubEdit('notes',this.value)">${escapeHtml(x.notes)}</textarea></label><button class="button" onclick="hubGenerate()">重生成报告草稿</button><button class="button secondary" onclick="hubPublish()">审核后发布到客户端</button><div class="hub-pre">${escapeHtml(x.full||'尚未生成')}</div>`:`<button class="button" onclick="hubInternal()">生成内部摘要</button><div class="hub-pre">${escapeHtml(x.internal||'尚未生成')}</div><p class="hub-small">内部摘要不向客户端显示。</p>`}`)}
function hubSettings(){return card('系统设置 · 主管理员功能演示',`<p class="hub-small">当前单机版不具备真实角色鉴权；正式系统必须在服务器端实施权限控制。</p>${[['roles','角色权限'],['forms','表单配置'],['automation','自动化流程查看']].map(([k,t])=>`<label>${t}<textarea class="hub-textarea" oninput="hub.settings.${k}=this.value;hubSave()">${escapeHtml(hub.settings[k])}</textarea></label>`).join('')}<div class="hub-actions"><button class="button" onclick="hubExport()">导出全部数据备份</button><label class="button secondary" style="cursor:pointer">导入备份文件<input type="file" accept=".json" style="display:none" onchange="hubImport(this.files[0])"></label></div><p class="hub-small">导出包括V0.9主数据与新增管理师数据，不包含IndexedDB存储的外院报告文件正文。</p>`)}
function hubExport(){let data={format:'longevity-v09-merged-backup',version:1,exportedAt:new Date().toISOString(),state,hub};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='sunny_health_v09_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function hubImport(f){if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=='longevity-v09-merged-backup'||x.version!==1||!x.state||!x.hub||!Array.isArray(x.hub.members))throw Error('文件格式不正确');if(!confirm('导入将覆盖当前本地演示数据，确定继续？'))return;state=x.state;hub=x.hub;save();hubSave();render();alert('导入成功')}catch(e){alert('导入失败：'+e.message)}}
function hubView(){hubSync();return head('健康管理师 · 六模块工作台','在V0.9原导航内融合新增管理功能，原客户360°、体检、结算、随访等模块全部保留')+hubMenu()+[hubOverview,hubMembers,hubQuestionnaires,hubReports,hubPlans,hubSettings][hubTab]()}
const originalV09ManagerView=view;
view=function(){if(activeRole==='manager'&&page==='home')return hubView();return originalV09ManagerView()};
const originalV09ClientReports=clientReportsView;
clientReportsView=function(){let base=originalV09ClientReports();let x=hub.members[0];if(x?.published&&x.full)base+=card('健康管理师审核发布的完整版报告',`<div class="hub-pre">${escapeHtml(x.full)}</div><button class="button secondary" onclick="window.print()">打印 / 保存PDF</button>`);return base};
if(!localStorage.getItem('longevity_v09_privacy_ack'))setTimeout(()=>{alert('隐私提醒：这是浏览器本地演示版，请勿录入真实客户身份信息、病历或敏感健康资料。数据保存在当前浏览器中，建议定期导出备份。');localStorage.setItem('longevity_v09_privacy_ack','1')},100);

try{render()}catch(e){console.error(e);document.getElementById('root').innerHTML='<main style="padding:32px;font-family:sans-serif;color:#624837"><h2>工作台启动遇到问题</h2><p>请将错误截图发给开发人员。</p><pre id="err"></pre></main>';document.getElementById('err').textContent=String(e)}
</script><script>
(function(){
  try {
    document.documentElement.dataset.deviceDemo='ipad';
  } catch(e){}
})();
</script></body></html>
